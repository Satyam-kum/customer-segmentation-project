services:

  # ==========================================================
  # PostgreSQL Database
  # ==========================================================

  postgres:

    image: postgres:16

    container_name: customer-intelligence-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: customer_intelligence
      POSTGRES_USER: cip_user
      POSTGRES_PASSWORD: cip_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cip_user -d customer_intelligence"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================
  # FastAPI Backend
  # ==========================================================

  backend:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: customer-intelligence-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      DATABASE_URL: postgresql+psycopg2://cip_user:cip_password@postgres:5432/customer_intelligence

      MODEL_DIR: /app/models

      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    volumes:

      - ./backend:/app/backend

      - ./ml:/app/ml

      - ./models:/app/models

      - ./data:/app/data

    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]


  # ==========================================================
  # React Frontend
  # ==========================================================

  frontend:

    image: node:20-alpine

    container_name: customer-intelligence-frontend

    working_dir: /app

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    volumes:

      - ./frontend:/app

      - frontend_node_modules:/app/node_modules

    command:
      [
        "sh",
        "-c",
        "npm install && npm run dev -- --host 0.0.0.0"
      ]


# ============================================================
# Persistent Volumes
# ============================================================

volumes:

  postgres_data:

  frontend_node_modules: